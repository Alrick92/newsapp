<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Newsfeed</title>
  <meta name="description" content="A personal news reader: your feeds, unread counts, stars, full-text search and AI-curated trending stories.">
  <link rel="icon" href="/static/icons/favicon-32.png" type="image/png">
  <!-- Installable app (PWA). use-credentials so the manifest loads behind a password-protected load balancer. -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#f6f8f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c141d" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Newsfeed">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    try { const t = localStorage.getItem("nf-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <div class="brand">
        <div>
          <h1 class="brand__name">Newsfeed</h1>
          <p class="brand__meta" id="meta">Loading the last 72 hours…</p>
        </div>
      </div>
      <div class="masthead__actions">
        <span class="badge badge--demo" id="demo-badge" hidden>Demo data</span>
        <button class="btn btn--ghost" id="install" type="button" hidden title="Install Newsfeed as an app">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
          <span>Install</span>
        </button>
        <button class="btn btn--ghost" id="refresh" type="button" title="Poll feeds now">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          <span>Refresh</span>
        </button>
        <button class="btn btn--icon" id="theme" type="button" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
  </header>

  <div class="offline" id="offline" role="status" hidden></div>

  <main class="page">
    <section class="filters" id="filters" aria-label="Filters">
      <label class="category">
        <span class="visually-hidden">Category</span>
        <select id="category" class="select select--category"></select>
      </label>
      <label class="region" id="region-wrap" hidden>
        <span class="visually-hidden">Region</span>
        <select id="region" class="select"></select>
      </label>
      <label class="search feed-only">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search stories" autocomplete="off">
      </label>
      <div class="segmented feed-only" id="hours" role="radiogroup" aria-label="Time window"></div>
      <div class="dropdown feed-only" id="sources-dd">
        <button class="btn btn--ghost dropdown__toggle" type="button" aria-expanded="false" id="sources-btn">
          <span id="sources-label">All sources</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dropdown__panel" id="sources-panel" hidden></div>
      </div>
      <select id="sort" class="select feed-only" aria-label="Sort">
        <option value="newest">Newest first</option>
        <option value="source">By source</option>
        <option value="relevance" id="sort-relevance" hidden>Best match</option>
      </select>
      <label class="toggle feed-only">
        <input type="checkbox" id="unread-only">
        <span>Unread only</span>
      </label>
      <label class="toggle feed-only">
        <input type="checkbox" id="has-image">
        <span>With images</span>
      </label>
      <button class="btn btn--link feed-only" id="clear" type="button" hidden>Clear filters</button>
    </section>

    <section id="trending-view" class="view" hidden>
      <div class="trending-head">
        <div>
          <h2 class="section-title">Trending now</h2>
          <p class="section-sub" id="trending-sub"></p>
        </div>
        <button class="btn btn--ghost" id="trending-refresh" type="button">Regenerate</button>
      </div>
      <div id="trending" class="trending"></div>
    </section>

    <section id="feed-view" class="view">
      <p class="result-count" id="count" aria-live="polite"></p>
      <div id="grid" class="grid"></div>
      <div class="more"><button class="btn btn--ghost" id="more" type="button" hidden>Load more</button></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button class="btn btn--link" id="toast-undo" type="button" hidden>Undo</button>
  </div>

  <footer class="footer">
    <p class="keys" id="keys">Keys: <kbd>j</kbd>/<kbd>k</kbd> next/previous · <kbd>m</kbd> read/unread · <kbd>s</kbd> star ·
      <kbd>o</kbd> open · <kbd>/</kbd> search · <kbd>Shift</kbd>+<kbd>A</kbd> mark all read</p>
    <p id="archive"></p>
    <p>Headlines and summaries come from each publisher's public RSS feed. Links open the original article.</p>
  </footer>

  <template id="card-tpl">
    <article class="card">
      <a class="card__media" target="_blank" rel="noopener noreferrer" tabindex="-1"></a>
      <div class="card__body">
        <div class="card__meta"><span class="chip"></span><span class="dot">·</span><time></time></div>
        <h3 class="card__title"><a target="_blank" rel="noopener noreferrer"></a></h3>
        <p class="card__desc"></p>
        <p class="card__also" hidden></p>
        <div class="card__summary" hidden></div>
        <a class="card__url" target="_blank" rel="noopener noreferrer"></a>
        <div class="card__actions">
          <button class="act act--read" type="button"></button>
          <button class="act act--star" type="button" aria-pressed="false"></button>
          <button class="act act--summary" type="button" hidden>Summarize</button>
        </div>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
