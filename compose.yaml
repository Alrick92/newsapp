# Newsfeed behind a load balancer.
#
# No ports are published to the host. The app listens on port 8000 on the
# INTERNAL "lb" network only: Docker gives that network no route to or from the
# outside world, so the only way in is a load balancer container joined to it,
# routing to http://newsfeed:8000. The network is created on first `up` if it
# doesn't exist; if your load balancer already has one, set LB_NETWORK to it.
#
# Because "lb" is internal, outbound traffic (feeds, AI endpoint) leaves through
# a separate private "egress" network. Nothing is published on it either, so it
# accepts no inbound connections.
#
# AI for trending stories connects to a remote endpoint configured in .env
# (see .env.example): Claude, any OpenAI-compatible URL + API key, or a remote
# Ollama URL (+ optional API key). Nothing AI-related runs in this stack.

services:
  newsfeed:
    build: .
    image: newsfeed:latest
    restart: unless-stopped
    env_file:
      - path: .env          # AI provider URL / API key etc.; see .env.example
        required: false
    environment:
      # Only the load balancer can reach the container, so trust its
      # X-Forwarded-* headers. Narrow this to the LB's address if you prefer.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    volumes:
      - newsfeed-data:/data
    networks:
      lb:
        aliases: [newsfeed]
      egress:
    # The feed poller runs inside the app process: keep exactly one replica.
    deploy:
      replicas: 1
    # Hardening: read-only image filesystem, writable /data volume and /tmp only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  newsfeed-data:

networks:
  lb:
    # Fixed name (not project-prefixed) so a load balancer can join it. Compose
    # creates it when missing (as internal) and attaches to it when it already
    # exists, in which case that network's own settings apply.
    name: ${LB_NETWORK:-lb}
    internal: true
  # Outbound-only: lets the app reach feed sites and the AI endpoint.
  egress:
